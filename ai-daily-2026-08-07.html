<title>AI 晨报仪表盘</title>
<style>
  :root{
    --bg:#f5f6fb;
    --card:#ffffff;
    --ink:#1f2430;
    --muted:#6b7280;
    --line:#e7e9f0;
    --c0:#6366f1; --c1:#0ea5e9; --c2:#10b981; --c3:#f59e0b; --c4:#ec4899;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 18px 60px;}

  /* Hero */
  .hero{
    margin:0 auto 22px; max-width:1080px;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#0ea5e9 100%);
    color:#fff; border-radius:0 0 26px 26px; padding:38px 30px 30px;
    box-shadow:0 18px 40px -18px rgba(99,102,241,.55);
  }
  .hero .kicker{letter-spacing:2px; font-size:13px; opacity:.9; font-weight:600;}
  .hero h1{margin:8px 0 4px; font-size:34px; line-height:1.2; font-weight:800;}
  .hero .date-sub{font-size:15px; opacity:.92; margin-bottom:18px;}
  .hero .meta{font-size:13px; opacity:.85; margin-top:14px;}
  .stats{display:flex; flex-wrap:wrap; gap:12px;}
  .stat{
    flex:1 1 150px; background:rgba(255,255,255,.16); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.25); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .stat .dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .stat .n{font-size:22px; font-weight:800; line-height:1;}
  .stat .l{font-size:12.5px; opacity:.92;}

  /* Nav */
  .nav{
    position:sticky; top:0; z-index:20; background:rgba(245,246,251,.9);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 18px; margin-bottom:22px;
  }
  .nav a{
    flex:none; text-decoration:none; color:var(--ink); font-size:13.5px; font-weight:600;
    padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:#fff;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:.15s;
  }
  .nav a:hover{border-color:var(--c); color:var(--c);}
  .nav a .badge{font-size:11px; background:var(--c); color:#fff; border-radius:999px; padding:1px 7px; font-weight:700;}

  /* Sections */
  .sec{scroll-margin-top:64px; margin-bottom:34px;}
  .sec-head{display:flex; align-items:center; gap:10px; margin:0 0 14px;}
  .sec-dot{width:12px; height:12px; border-radius:4px;}
  .sec-head h2{margin:0; font-size:20px; font-weight:800;}
  .sec-count{font-size:13px; color:var(--muted); font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px;}

  /* Card */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 16px 14px; display:flex; flex-direction:column; min-height:150px;
    transition:.18s; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 14px 30px -14px rgba(16,24,40,.22); border-color:#d7dbf0;}
  .card-top{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .num{
    width:26px; height:26px; border-radius:8px; flex:none; color:#fff; font-weight:800;
    font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .chip{
    font-size:12px; color:var(--muted); background:#f1f2f7; border:1px solid var(--line);
    padding:2px 9px; border-radius:999px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .card-title{margin:0 0 8px; font-size:15.5px; line-height:1.45; font-weight:700;}
  .card-title a{color:var(--ink); text-decoration:none;}
  .card-title a:hover{color:var(--c); text-decoration:underline;}
  .summary{margin:0 0 12px; font-size:13.5px; color:#4b5563; flex:1;}
  .readmore{
    align-self:flex-start; font-size:13px; font-weight:700; color:var(--c);
    text-decoration:none; border:1px solid var(--c); padding:4px 12px; border-radius:999px; transition:.15s;
  }
  .readmore:hover{background:var(--c); color:#fff;}

  /* Footer */
  .foot{
    text-align:center; color:var(--muted); font-size:12.5px; border-top:1px solid var(--line);
    padding-top:22px; margin-top:10px; line-height:1.8;
  }
  .foot a{color:var(--c0); text-decoration:none;}
  .foot a:hover{text-decoration:underline;}

  @media (max-width:600px){
    .hero{padding:28px 20px 24px; border-radius:0 0 20px 20px;}
    .hero h1{font-size:27px;}
    .stat{flex:1 1 44%;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>

const SECTIONS = REPORT.sections || [];
const TOTAL = SECTIONS.reduce((a,s)=>a+((s.items&&s.items.length)||0),0);
const COLORS = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ec4899'];
const color = i => COLORS[i % COLORS.length];

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function truncate(s, n){
  if(!s) return '—';
  const arr = [...String(s)];
  if(arr.length <= n) return s;
  return arr.slice(0, n-1).join('') + '…';
}
function dateHuman(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const wk = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dt.getDay()];
  return `${y}年${m}月${d}日 ${wk}`;
}
function fmtBJ(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const bj = new Date(d.getTime() + 8*3600*1000);
  const p = n => String(n).padStart(2,'0');
  return `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日 ${p(bj.getUTCHours())}:${p(bj.getUTCMinutes())}`;
}
function fmtBJshort(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const bj = new Date(d.getTime() + 8*3600*1000);
  const p = n => String(n).padStart(2,'0');
  return `${bj.getUTCMonth()+1}月${bj.getUTCDate()}日 ${p(bj.getUTCHours())}:${p(bj.getUTCMinutes())}`;
}

// Hero
document.getElementById('hero-date').textContent = dateHuman(REPORT.date) + ' · AI 晨报';
document.getElementById('hero-sub').textContent =
  `今日共收录 ${TOTAL} 条 AI 动态 · 覆盖北京时间 ${fmtBJshort(REPORT.windowStart)} – ${fmtBJshort(REPORT.windowEnd)}`;
document.getElementById('hero-meta').textContent =
  `AI HOT 生成于 北京时间 ${fmtBJ(REPORT.generatedAt)}`;

document.getElementById('hero-stats').innerHTML = SECTIONS.map((s,i)=>`
  <div class="stat">
    <span class="dot" style="background:${color(i)}"></span>
    <div><div class="n">${s.items.length}</div><div class="l">${escapeHtml(s.label)}</div></div>
  </div>`).join('');

// Nav
document.getElementById('nav').innerHTML = SECTIONS.map((s,i)=>`
  <a href="#sec-${i}" style="--c:${color(i)}">${escapeHtml(s.label)}<span class="badge">${s.items.length}</span></a>`).join('');

// Body
let num = 0;
document.getElementById('body').innerHTML = SECTIONS.map((s,i)=>{
  const items = s.items || [];
  const cards = items.map(it=>{
    num++;
    const url = (it.links && (it.links.original || it.links.aihot)) || '#';
    const src = (it.source && it.source.name) ? it.source.name : '未知来源';
    return `<article class="card" style="--c:${color(i)}">
      <div class="card-top">
        <span class="num" style="background:${color(i)}">${num}</span>
        <span class="chip" title="${escapeHtml(src)}">${escapeHtml(src)}</span>
      </div>
      <h3 class="card-title"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title)}</a></h3>
      <p class="summary">${escapeHtml(truncate(it.summary, 60))}</p>
      <a class="readmore" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>
    </article>`;
  }).join('');
  return `<section class="sec" id="sec-${i}">
    <div class="sec-head"><span class="sec-dot" style="background:${color(i)}"></span><h2>${escapeHtml(s.label)}</h2><span class="sec-count">${items.length} 条</span></div>
    <div class="grid">${cards}</div>
  </section>`;
}).join('');

// Footer
const canon = (REPORT.links && REPORT.links.aihot) || (REPORT.attribution && REPORT.attribution.url) || 'https://aihot.virxact.com';
const srcName = (REPORT.attribution && REPORT.attribution.name) || 'AI HOT';
document.getElementById('foot').innerHTML =
  `本日报共 <strong>${TOTAL}</strong> 条 · 数据来源：<a href="${escapeHtml(canon)}" target="_blank" rel="noopener noreferrer">${escapeHtml(srcName)}</a>（aihot.virxact.com）<br>` +
  `原始日报：<a href="${escapeHtml(canon)}" target="_blank" rel="noopener noreferrer">${escapeHtml(canon)}</a>`;
</script>
